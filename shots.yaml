# Shot list (D-22). Times are seconds within the act; voice lines refer to voice/timings.json.
# voice: [{line: <index in act>, at: <shot-local start>}]; cues name words so events hit the voice (English `word`,
#        German `de`; rocks/shots.py fits the picture to both recordings). A re-take replaces a line's act recording:
#        take (English) or de_take (German), a file in voice/ (rocks/audio/narration.py RETAKES, recorded with
#        scripts/make_audio.py --retake <file>); played from where its speech starts to where it ends (found in the
#        audio; take_start/take_end or de_take_start/de_take_end override that).
# sfx:   [{name: <key in rocks/audio/sfx.py LIBRARY>, at: <shot-local s>, [dur], [gain_db], [loop]}]
act4:
  - id: "4.1"
    act: 4
    scene: dust_room
    duration: 12.5
    voice: [{line: 0, at: 0.8, de_take: voice/de/act4_line0_take_b.mp3}]   # German: recorded after the end of Act 3
    cues: {vanish: {line: 0, word: "vanish.", de: "verschwindet."},
           nothing: {line: 0, word: "nothing.", de: "nichts."}}     # holds the German "…und dann nichts." back to the English beat
    sfx:
      - {name: room_tone, at: 0, dur: 12.5, gain_db: -14}
      - {name: dust_flash, at: vanish, gain_db: -6}
  - id: "4.2"
    act: 4
    scene: desert_hold_rock
    duration: 5.5
    voice: [{line: 1, at: 1.0}]
    sfx:
      - {name: desert_wind, at: 0, dur: 5.5, gain_db: -16}
  - id: "4.3"
    act: 4
    scene: desert_wide
    duration: 8.0
    params: {hold: true}      # still holding the rock from 4.2
    voice: [{line: 2, at: 0.4, take: voice/act4_line2_take_1.mp3}]   # re-take: new wording
    sfx:
      - {name: desert_wind, at: 0, dur: 8.0, gain_db: -13}
  - id: "4.4"
    act: 4
    scene: desert_turn
    duration: 5.0
    voice: [{line: 3, at: 1.8}]
    cues: {turn: {line: 3, word: "Oh.", de: "Ach"}}
    sfx:
      - {name: desert_wind, at: 0, dur: 5.0, gain_db: -18}
  - id: "4.5"
    act: 4
    scene: lecture_hall
    duration: 11.0
    voice: [{line: 4, at: 0.8}]
    sfx:
      - {name: room_tone, at: 0, dur: 11.0, gain_db: -16}
      - {name: clock_tick, at: 0.5, every: 1.0, until: 11.0, gain_db: -10}
  - id: "4.6"
    act: 4
    scene: desert_walk_row
    duration: 13.0
    voice: [{line: 5, at: 0.8, de_take: voice/de/act4_line5_take_d.mp3}]   # German: slower
    sfx:
      - {name: desert_wind, at: 0, dur: 13.0, gain_db: -15}     # no fade: the wind carries on under the credits
      # foot contacts of the walk cycle in desert_walk_row: 0.316 cycles/s -> first at 0.79 s, then every 1.58 s
      - {name: footstep_sand, at: 0.79, every: 1.58, until: 12.0, gain_db: -12}

