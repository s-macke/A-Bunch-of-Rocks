    cues: {third: {line: 2, word: "third", de: "dritte"}}
    sfx:
      - {name: desert_wind, at: 0, dur: 15.2, gain_db: -16}
      # rock clicks come from the scene itself (placements follow Rule 110), see out/act2_events.json
  - id: "2.3"
